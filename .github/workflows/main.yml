name: Build palen1x
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, i686, aarch64, armv7 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get version
        id: version
        run: echo "VERSION=$(cat version)" >> $GITHUB_ENV

      - name: Install qemu-user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          sudo -E ./build.sh RELEASE

      - name: Prepare artifact
        run: |
          mkdir palen1x
          # Copy the architecture-specific ISO
          cp work/*-${{ matrix.arch }}.iso palen1x/
          # Copy the architecture-specific initramfs
          cp work/iso/boot/initramfs.xz palen1x/initramfs-${{ matrix.arch }}.xz

      - name: Upload Latest Artifact
        uses: actions/upload-artifact@v3
        with:
          # IMPORTANT: Make the artifact name unique per architecture
          name: palen1x-${{ matrix.arch }}
          # IMPORTANT: Use the matrix.arch variable to correctly reference the files
          path: |
            palen1x/palen1x-${{ matrix.arch }}.iso
            palen1x/initramfs-${{ matrix.arch }}.xz
